name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-nix:
    name: setup-nix (${{ matrix.installer }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        installer:
          - determinate
          - upstream
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        id: nix
        uses: $/.github/actions/setup-nix
        with:
          installer: ${{ matrix.installer }}

      - name: Check the devshell evaluates
        run: nix develop .#dev --command nix --version

      - name: Report cache
        env:
          CACHE_HIT: ${{ steps.nix.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.nix.outputs.cache-key }}
        run: echo "cache-hit=$CACHE_HIT key=$CACHE_KEY"

  actions-lint:
    name: zizmor and pinact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action, not the devshell: nixpkgs carries zizmor 1.32.0 and that
      # package does not build on either architecture. Move this into the
      # devshell once nixpkgs fixes it.
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-confidence: medium
          version: 1.32.0

      - name: Setup Nix
        uses: $/.github/actions/setup-nix

      # --verify resolves every SHA back to its tag, and --min-age holds back
      # releases younger than three days. Both read the GitHub API, so pass a
      # token to stay clear of the anonymous rate limit.
      - name: pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find .github -name '*.yml' -o -name '*.yaml')
          nix develop .#dev --command pinact run --check --verify --min-age 3 "${files[@]}"
