name: Update flake lock

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3.20.0

      # nixpkgs stays put: the locked revision is the last one whose zizmor
      # builds on both architectures. Update it by hand, with `nix flake lock
      # --update-input nixpkgs`, after checking that. See AGENTS.md.
      - name: Update flake.lock
        run: nix flake update flake-parts mattware treefmt-nix

      - name: Validate flake
        run: nix flake check

      - name: Commit and push changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Update flake.lock"
          git push
